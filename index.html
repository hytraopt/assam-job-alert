<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="66lhUdCYjoP1lnlSzEEkBKabE7uw1MQ_SoN1mZWK7-I" />

  <!-- SEO Meta Tags for Google Search Ranking -->
  <title>Assam Job Alert - Latest Govt & Private Jobs in Assam</title>
  <meta name="description" content="Get daily updates for Government and Private Job recruitment in Assam. Find Assam job alerts, official notifications, and direct online application links.">
  <meta name="keywords" content="Assam Job Alert, Assam Govt Jobs, Assam Recruitment 2026, Assam Job Vacancy, Direct Jobs Assam">
  <meta name="robots" content="index, follow">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fe; color: #2b3674; padding-bottom: 20px; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header & Logo Styles */
    header { background: linear-gradient(135deg, #0b2545 0%, #134074 100%); color: white; padding: 25px 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .site-logo { width: 75px; height: 75px; object-fit: cover; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    header h1 { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
    header p { font-size: 13px; opacity: 0.8; }
    
    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; flex: 1; }
    
    .job-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(112, 144, 176, 0.1); border: 1px solid #e9edf7; position: relative; overflow: hidden; }
    .job-title { font-size: 18px; font-weight: 700; color: #1b2559; margin-bottom: 10px; padding-right: 50px; }
    
    .corner-new-tag { position: absolute; top: 15px; right: 15px; background: #ff4757; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4); animation: pulse 1.5s infinite; }
    
    .badge-container { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .badge { background: #e9f3ff; color: #0066ff; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.last-date { background: #fff4e5; color: #b76e00; }
    
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status-active { background: #def7ec; color: #03543f; }
    .status-expired { background: #fde8e8; color: #9b1c1c; }

    .summary-text { font-size: 14px; color: #475467; margin: 10px 0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #8f9bba; margin-top: 15px; }
    .section-desc { font-size: 14px; color: #475467; margin-top: 4px; line-height: 1.6; white-space: pre-line; }
    
    .action-btn { display: block; width: 100%; text-align: center; background: #0066ff; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; margin-top: 15px; cursor: pointer; border: none; transition: background 0.2s; }
    .action-btn:hover { background: #0052cc; }
    .action-btn.disabled { background: #9ca3af; pointer-events: none; }
    .back-btn { background: #64748b; margin-bottom: 15px; width: auto; display: inline-block; padding: 8px 16px; font-size: 13px; }

    .loading { text-align: center; font-weight: 600; color: #8f9bba; padding: 40px; }

    /* Footer & Modal Styles */
    footer { background: #0b2545; color: white; padding: 20px; text-align: center; margin-top: 40px; font-size: 13px; }
    footer a { color: #a3cfff; text-decoration: none; margin: 0 10px; font-weight: 500; cursor: pointer; }
    footer a:hover { text-decoration: underline; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: white; border-radius: 12px; max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 25px; color: #2b3674; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .close-modal { position: absolute; top: 15px; right: 15px; font-size: 22px; font-weight: bold; color: #64748b; cursor: pointer; border: none; background: none; }
    .modal-body h2 { color: #1b2559; margin-bottom: 12px; font-size: 20px; }
    .modal-body p { font-size: 14px; color: #475467; line-height: 1.6; margin-bottom: 12px; }
    
    .contact-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; word-break: break-word; overflow-wrap: anywhere; }
    .contact-box strong { color: #1b2559; display: block; margin-bottom: 4px; }
    .contact-box a { color: #0066ff; font-weight: 600; text-decoration: none; word-break: break-all; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <img src="IMG_20260901_193910_352.jpg" alt="Assam Job Alert Logo" class="site-logo" onerror="this.style.display='none'">
      <div>
        <h1>Assam Job Alert</h1>
        <p>Find Latest Government & Private Jobs in Assam</p>
      </div>
    </div>
  </header>

  <div class="container" id="main-container">
    <div class="loading">Loading Job Alerts...</div>
  </div>

  <footer>
    <p>© 2026 Assam Job Alert. All rights reserved.</p>
    <div style="margin-top: 10px;">
      <a onclick="openPage('about')">About Us</a> | 
      <a onclick="openPage('contact')">Contact Us</a> | 
      <a onclick="openPage('privacy')">Privacy Policy</a>
    </div>
  </footer>

  <div class="modal" id="page-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <div class="modal-body" id="modal-body-content"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyZnkUKP0lJ5cCN4B968GmvHHigAfMjuxJwGQH1WPqFgCBpYZpfLwWVyiiMuAY0DdoC-g/exec";
    let allJobsData = [];

    function formatDate(dateString) {
      if (!dateString) return "N/A";
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function isNewPost(postDateString) {
      if (!postDateString) return false;
      const postDate = new Date(postDateString);
      const now = new Date();
      const diffHours = (now - postDate) / (1000 * 60 * 60);
      return diffHours >= 0 && diffHours <= 24;
    }

    function isJobExpired(lastDateString) {
      if (!lastDateString) return false;
      const lastDate = new Date(lastDateString);
      lastDate.setHours(23, 59, 59, 999);
      return new Date() > lastDate;
    }

    function renderJobListView() {
      const container = document.getElementById("main-container");
      container.innerHTML = "";
      
      if(!allJobsData || allJobsData.length === 0) {
        container.innerHTML = "<div class='loading'>No active job posts found.</div>";
        return;
      }

      allJobsData.slice().reverse().forEach((job, index) => {
        const card = document.createElement("div");
        card.className = "job-card";
        const showNewTag = isNewPost(job["Date"]);
        const expired = isJobExpired(job["Last Date"]);

        card.innerHTML = `
          ${showNewTag ? '<div class="corner-new-tag">NEW</div>' : ''}
          <div class="job-title">${job["Job Title"]}</div>
          <div class="badge-container">
            <span class="badge">Posted: ${formatDate(job["Date"])}</span>
            <span class="badge last-date">Last Date: ${formatDate(job["Last Date"])}</span>
            <span class="status-badge ${expired ? 'status-expired' : 'status-active'}">
              ${expired ? 'Expired' : 'Active'}
            </span>
          </div>
          <div class="summary-text">${job["About Job"]}</div>
          <button onclick="openJobDetails(${index})" class="action-btn">About Job & Apply Details →</button>
        `;
        container.appendChild(card);
      });
      window.scrollTo(0,0);
    }

    function openJobDetails(index) {
      const actualIndex = allJobsData.length - 1 - index;
      const job = allJobsData[actualIndex];
      const expired = isJobExpired(job["Last Date"]);
      const showNewTag = isNewPost(job["Date"]);

      const container = document.getElementById("main-container");
      container.innerHTML = `
        <button onclick="renderJobListView()" class="action-btn back-btn">← Back to All Jobs</button>
        <div class="job-card">
          ${showNewTag ? '<div class="corner-new-tag">NEW</div>' : ''}
          <div class="job-title">${job["Job Title"]}</div>
          <div class="badge-container">
            <span class="badge">Posted: ${formatDate(job["Date"])}</span>
            <span class="badge last-date">Last Date: ${formatDate(job["Last Date"])}</span>
            <span class="status-badge ${expired ? 'status-expired' : 'status-active'}">
              ${expired ? 'Expired' : 'Active'}
            </span>
          </div>
          
          <div class="section-title">About Job</div>
          <div class="section-desc">${job["About Job"]}</div>
          
          <div class="section-title">Requirements</div>
          <div class="section-desc">${job["Requirements"]}</div>
          
          ${expired 
            ? '<button class="action-btn disabled">Applications Closed</button>' 
            : `<a href="${job["Apply Link"]}" target="_blank" class="action-btn">Apply Online Now</a>`
          }
        </div>
      `;
      window.scrollTo(0,0);
    }

    function openPage(pageType) {
      const modal = document.getElementById("page-modal");
      const modalContent = document.getElementById("modal-body-content");
      
      if(pageType === 'about') {
        modalContent.innerHTML = `
          <h2>About Us</h2>
          <p>Welcome to <strong>Assam Job Alert</strong>, your primary destination for real-time notifications on official recruitment notices across Assam.</p>
          <p>Our mission is to simplify job hunting for aspirants across Assam by providing clear, organized, and timely recruitment details for both Government and Private sector openings.</p>
          <p>We aggregate job data from official departmental notifications to help you stay updated on upcoming recruitment dates, eligibility requirements, and application procedures.</p>
        `;
      } else if(pageType === 'contact') {
        modalContent.innerHTML = `
          <h2>Contact Us</h2>
          <p>Feel free to reach out to us for job postings, queries, or user support.</p>
          
          <div class="contact-box">
            <strong>📢 Job Posting / Business Inquiry:</strong>
            <p style="margin-bottom:4px;">Want to publish a job vacancy on our portal? Contact us at:</p>
            <a href="mailto:contactassamjobalert@gmail.com">contactassamjobalert@gmail.com</a>
          </div>

          <div class="contact-box">
            <strong>❓ Help & General Support:</strong>
            <p style="margin-bottom:4px;">For any portal-related queries or feedback, email us at:</p>
            <a href="mailto:supportassamjobalert@gmail.com">supportassamjobalert@gmail.com</a>
          </div>

          <p style="margin-top:10px;"><strong>Location:</strong> Guwahati, Assam, India</p>
        `;
      } else if(pageType === 'privacy') {
        modalContent.innerHTML = `
          <h2>Privacy Policy</h2>
          <p>At <strong>Assam Job Alert</strong>, accessible from our site, the privacy of our visitors is one of our top priorities.</p>
          <p><strong>Log Files:</strong> Assam Job Alert follows a standard procedure of using log files. These files log visitors when they visit websites. The information collected includes IP addresses, browser types, ISP, date and time stamps, and referring pages.</p>
          <p><strong>Google DoubleClick DART Cookie:</strong> Google is one of a third-party vendor on our site. It also uses cookies, known as DART cookies, to serve ads to our site visitors based upon their visit to our site and other sites on the internet.</p>
          <p><strong>Third Party Advertisers:</strong> We may use third-party advertising companies (such as Google AdSense) to serve ads when you visit our website. These companies may use aggregated information about your visits to provide advertisements about goods and services of interest to you.</p>
        `;
      }
      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("page-modal").style.display = "none";
    }

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        allJobsData = data;
        renderJobListView();
      });
  </script>
</body>
</html>
